# Use hoisted node_modules so npm bundledDependencies can be packed for Pi package dependencies.
nodeLinker: hoisted

# Reject installs of packages published less than 3 days ago (4320 minutes).
# Supply-chain defense — most malicious packages are caught within a few days.
minimumReleaseAge: 4320

# Approved Pi 0.99.2 upgrade; frozen installs also verify release age.
# One-time exception to adopt 0.99.2 before the 72h maturity window. With the
# open-range devDependency policy (>=0.99.2), routine updates need no entry
# here: releases become eligible automatically once 72h old.
# Keep the exception version-specific, including Pi's required aligned packages.
minimumReleaseAgeExclude:
  - '@earendil-works/pi-coding-agent@0.99.2'
  - '@earendil-works/chord@0.99.2'
  - '@earendil-works/pi-agent-core@0.99.2'
  - '@earendil-works/pi-ai@0.99.2'
  - '@earendil-works/pi-tui@0.99.2'
  - '@earendil-works/pi-mcp@0.99.2'
  - '@earendil-works/pi-codemode@0.99.2'
  - '@earendil-works/pi-telemetry@0.99.2'

# Refuse to install a package whose maintainer trust level has decreased
# (e.g. previously verified publisher loses verification).
trustPolicy: no-downgrade

# Block transitive dependencies from using git: or tarball sources.
blockExoticSubdeps: true

allowBuilds:
  '@google/genai': true
  esbuild: false
  koffi: true
  protobufjs: true
